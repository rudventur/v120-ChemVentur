<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CHEMVENTUR v120 · Stage 3</title>
  <link rel="stylesheet" href="stage3-game/css/stage3-game.css">
  <style>
    html, body { margin: 0; height: 100%; background: #000a03; overflow: hidden; }
    #s3g { position: fixed; inset: 0; }
    #older {
      position: fixed; z-index: 80; top: 8px; left: 8px;
      color: #00ff41; background: rgba(0,0,0,.75);
      border: 1px solid #00ff41; padding: 6px 10px;
      font: 12px/1.2 Courier New, monospace; text-decoration: none;
    }
  </style>
</head>
<body>
  <a id="older" href="game-v118.html">Stages 0–2</a>
  <div id="s3g"></div>
  <script src="stage3-game/js/stage3-chem.js"></script>
  <script src="stage3-game/js/s3g-core.js"></script>
  <script src="stage3-game/js/s3g-audio.js"></script>
  <script src="stage3-game/js/s3g-world.js"></script>
  <script src="stage3-game/js/s3g-game.js"></script>
  <script src="stage3-game/js/s3g-discovery.js"></script>
  <script src="stage3-game/js/s3g-bots.js"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    CHEMVENTUR.Stage3Game.ready = CHEMVENTUR.Stage3Game.boot(document.getElementById('s3g'), {
      autostart: qs.has('autostart')
    }).then(g => {
      if (qs.has('bots') && CHEMVENTUR.Stage3Game.Bots) CHEMVENTUR.Stage3Game.Bots.spawnAll();
      return g;
    });
  </script>
</body>
</html>
